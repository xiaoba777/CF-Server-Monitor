# CF-Server-Monitor isolated roles. Keep ABOVE catch-all trust/scram rules.
# Allow these logins only to cf_server_monitor; reject every other database.
# Replace DOCKER_BRIDGE_CIDR before install if the script did not substitute it.
local   cf_server_monitor   cf_monitor_migrator,cf_monitor_runtime                 scram-sha-256
local   all                 cf_monitor_migrator,cf_monitor_runtime                 reject
host    cf_server_monitor   cf_monitor_migrator,cf_monitor_runtime   127.0.0.1/32   scram-sha-256
host    cf_server_monitor   cf_monitor_migrator,cf_monitor_runtime   ::1/128        scram-sha-256
host    cf_server_monitor   cf_monitor_migrator,cf_monitor_runtime   DOCKER_BRIDGE_CIDR  scram-sha-256
host    all                 cf_monitor_migrator,cf_monitor_runtime   0.0.0.0/0      reject
host    all                 cf_monitor_migrator,cf_monitor_runtime   ::/0           reject
